name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name "OutfitAssistant" run.py
      - uses: actions/upload-artifact@v4
        with:
          name: OutfitAssistant-Windows
          path: dist/OutfitAssistant.exe
          retention-days: 30
